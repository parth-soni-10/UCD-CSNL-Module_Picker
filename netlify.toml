# Netlify deployment config for the CSNL Module Picker
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Cold fetches for a batch of modules can take a while; allow up to 26s.
[functions.timetable]
  maxDuration = 26

# The catalogue may need to fetch + parse the source site on a new academic
# year; give it the same headroom.
[functions.catalogue]
  maxDuration = 26

# The assessment scraper fetches one page per module (~68) on a cold start;
# give it the same headroom as the other fetching functions.
[functions.assessments]
  maxDuration = 26

# Re-read UCD's CSNL streams page daily and update the module list the moment
# UCD changes it (page_last_update stamp compare; only rewrites on change).
# This keeps offerings current year-round, not just on the 1-August
# publication date. The GET endpoint also self-heals on every request.
[functions."refresh-catalogue"]
  schedule = "0 0 * * *"

# Full policy. script-src stays 'self' with no 'unsafe-inline', which also
# suppresses Netlify's "Powered by Netlify" badge (injected as an inline script
# on Free-plan projects) — the site itself ships exactly one same-origin script,
# and the service worker is registered from inside it rather than inline.
#
# The rest was previously unspecified, which left the page frameable by any
# site. Every origin here is first-party: fonts are self-hosted, data comes from
# same-origin functions, so nothing else needs an allowance.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

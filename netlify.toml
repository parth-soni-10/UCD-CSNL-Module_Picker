# Netlify deployment config for the CSNL Module Picker
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Cold fetches for a batch of modules can take a while; allow up to 26s.
[functions.timetable]
  maxDuration = 26

# The catalogue may need to fetch + parse the source site on a new academic
# year; give it the same headroom.
[functions.catalogue]
  maxDuration = 26

# Re-read UCD's CSNL streams page daily and update the module list the moment
# UCD changes it (page_last_update stamp compare; only rewrites on change).
# This keeps offerings current year-round, not just on the 1-August
# publication date. The GET endpoint also self-heals on every request.
[functions."refresh-catalogue"]
  schedule = "0 0 * * *"

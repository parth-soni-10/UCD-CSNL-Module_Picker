# Local development config — for `wrangler dev` only, never for a deploy.
#
#     npx wrangler dev --config wrangler.dev.toml
#
# Why this is a second file: wrangler.toml is the Pages build's bundle input, and
# a bundle input carries only what bundling reads. The assets directory and the KV
# namespace below are what a running process needs, not what esbuild needs — and
# leaving them in wrangler.toml is how a `wrangler deploy` run from this directory
# silently publishes a second copy of this site to a workers.dev hostname. This
# site has one host, the Pages project.
#
# Kept in step with pages/wrangler.toml by hand: the KV id is the same namespace
# the deployed site uses, so a local run reads the catalogue readers actually see.
# To test what the deploy serves, run the two build-command steps and then
# `npx wrangler pages dev .pages-dist`.

name = "ucd-csnl-module-picker"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/.netlify/functions/*"]

# One namespace holding both stores the functions used to keep in Netlify
# blobs, under their original names:
#   csnl-catalogue/modules   (the module catalogue)
#   csnl-assessments/map     (the exam-assessment map)
[[kv_namespaces]]
binding = "STORE_KV"
id = "a6f075b04f284e42b1b1fd88e96a7a7b"

name: Refresh the catalogue

# The daily catalogue refresh — the schedule that used to be three Cloudflare
# cron triggers.
#
# It ran on the Worker (`[triggers]` in wrangler.toml → worker.js `scheduled` →
# netlify/functions/refresh-catalogue.js) because a Cloudflare deploy had no
# scheduler of its own to keep UCD's module list current. This site is served
# from Cloudflare Pages now, which has no cron triggers either, so the schedule
# lives here and calls the very same handler over the site's own host.
#
# Three passes rather than one, at the times the crons used: a free-plan
# invocation may make only 50 subrequests and a module page costs two of them, so
# one pass covers about 22 of the ~68 modules and the three rotate through the
# whole list (see MAX_SUBREQUESTS in worker.js). A visitor's own catalogue request
# refreshes page-by-page too, so a missed pass is a delay rather than an outage —
# catalogue.js self-heals on every request.

on:
  schedule:
    # 00:00, 00:20 and 00:40 UTC.
    - cron: "0 0 * * *"
    - cron: "20 0 * * *"
    - cron: "40 0 * * *"
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

permissions:
  contents: read

# Serialize runs: two passes at once would spend the same subrequest budget on
# the same modules instead of covering more of the list.
concurrency:
  group: refresh-catalogue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh the catalogue and the assessment map
        run: |
          set -euo pipefail
          url="https://ucdcsnlmodulepicker.pages.dev/.netlify/functions/refresh-catalogue"
          # A pass spends its budget fetching module pages one after another, so
          # the timeout is generous rather than tight.
          code=$(curl -sS --max-time 300 -o /tmp/refresh.out -w '%{http_code}' "$url")
          cat /tmp/refresh.out; echo
          echo "HTTP $code"
          case "$code" in
            # 200 = catalogue and assessments both refreshed; 207 = the catalogue
            # is fine and the assessment pass was partial (it rotates, like a
            # cron pass always did). Anything else is a real failure and fails
            # the run on purpose.
            200|207) exit 0 ;;
            *) echo "::error::the refresh returned HTTP $code"; exit 1 ;;
          esac

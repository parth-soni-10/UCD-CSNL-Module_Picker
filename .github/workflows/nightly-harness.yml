name: Timetable harness

# The full harness asks UCD live for the catalogue and every module's timetable,
# so it is scheduled rather than run on push: a UCD outage is not a regression in
# this repo, and it should not block a PR.
#
# It starts the same zero-dependency dev server a developer would (server.js),
# then runs tools/test-timetables.js against it.

on:
  schedule:
    - cron: '0 7 * * *' # daily, 07:00 UTC
  workflow_dispatch: {}

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run the timetable harness
        run: |
          set -e
          node server.js &
          SERVER_PID=$!
          # server.js only binds once the functions are required; poll it rather
          # than guessing a sleep.
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8787/; then break; fi
            sleep 1
          done
          node tools/test-timetables.js
          STATUS=$?
          kill $SERVER_PID || true
          exit $STATUS

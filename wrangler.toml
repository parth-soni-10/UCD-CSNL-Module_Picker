# Bundle input for this site's Pages build — NOT a deployment.
#
# The Cloudflare Pages project runs, as its build command:
#
#   npx --yes wrangler@4 deploy --dry-run --outdir .pages-bundle
#   && node tools/deploy-pages.mjs --assets . --bundle .pages-bundle --out .pages-dist
#
# and this file is read for the first half of that only: `--dry-run` bundles
# `main` below into the worker.js that tools/deploy-pages.mjs stages as the
# project's `_worker.js`. Nothing is deployed from here, and nothing should be —
# this site has one host, the Pages project. A `wrangler deploy` run in this
# directory would publish a second copy of the same code to a workers.dev
# hostname nobody links to, which is what the host consolidation removed.
#
# Everything the deployed site needs lives where the deploy reads it:
# `pages/wrangler.toml` carries the project name and its STORE_KV binding,
# `_headers` carries the response headers, and the daily catalogue refresh is a
# GitHub Actions workflow (.github/workflows/refresh-catalogue.yml) because Pages
# has no cron triggers.
#
# Not published: `.assetsignore` lists this file, so it is never uploaded.

name = "ucd-csnl-module-picker"
main = "worker.js"
compatibility_date = "2026-10-01"

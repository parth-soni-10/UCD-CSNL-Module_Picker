# The one config this site has: its Cloudflare Pages project.
#
#   npx wrangler pages dev .           → local test on http://localhost:8788
#   npx wrangler pages deploy          → publish .pages-dist to the project
#
# There is no Worker config and no Worker. The function half of the site — the
# five `/.netlify/functions/*` endpoints — is a Pages Function:
# `functions/[[path]].js` catches every request and hands it to
# `functions/_router.js`, which routes it to the module under netlify/functions/
# that answers it. Pages compiles those files as part of the deploy, so nothing
# is bundled here, there is no `_worker.js` to stage, and `wrangler deploy` is
# not a command this repository has any use for.
#
# `pages_build_output_dir` names the upload tools/deploy-pages.mjs stages from
# this repository (the repository root, minus `.assetsignore`).
#
# No [triggers] here, and that is not an omission: Pages has no cron triggers, so
# the catalogue refresh lives in .github/workflows/refresh-catalogue.yml, which
# calls this deployment's own refresh route twice a month (the 1st and the 15th)
# in three budgeted passes.

name = "ucdcsnlmodulepicker"
pages_build_output_dir = ".pages-dist"
compatibility_date = "2026-10-01"

# The KV namespace the module catalogue, the assessments map and the suggestion
# list live in — the only copy.
[[kv_namespaces]]
binding = "STORE_KV"
id = "a6f075b04f284e42b1b1fd88e96a7a7b"
